<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cequre Engine</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Recursive:wght@300..1000&display=swap");

    :root {
      --bg: #030407;
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --text-muted: #8a94a6;
      --accent: #22d3ee;
      --glow: rgba(34, 211, 238, 0.15);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, var(--glow) 0%, transparent 40%),
        radial-gradient(circle at 50% 100%, rgba(244, 114, 182, 0.05) 0%, transparent 40%);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      padding: 24px;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 560px;
      text-align: center;
      position: relative;
    }

    .container::before {
      content: '';
      position: absolute;
      inset: -2px;
      background: linear-gradient(180deg, var(--accent), transparent);
      border-radius: 26px;
      z-index: -1;
      opacity: 0.2;
      filter: blur(8px);
    }

    .card {
      background: rgba(10, 12, 18, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 211, 238, 0.1);
      border: 1px solid rgba(34, 211, 238, 0.2);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    h1 {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      background: linear-gradient(180deg, #fff, #a1a1aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.description {
      color: var(--text-muted);
      font-size: 16px;
      margin-bottom: 40px;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 14px;
      color: #e4e4e7;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-primary {
      background: var(--text);
      color: var(--bg);
      border: 1px solid var(--text);
    }

    .btn-primary:hover {
      background: transparent;
      color: var(--text);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .footer {
      margin-top: 40px;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    .footer-line {
      height: 1px;
      background: var(--border);
      flex: 1;
      max-width: 40px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="badge">
        <span class="badge-dot"></span>
        API Online
      </div>
      <h1>Cequre Engine</h1>
      <p class="description">
        Your Cequre engine is running beautifully.<br/>
        API endpoints are mounted under <code>/api</code>.
      </p>
      
      <div class="actions">
        <a href="/api/docs" class="btn btn-primary">View API Docs</a>
        <a href="/api" class="btn btn-secondary">API Root</a>
      </div>
    </div>
    
    <div class="footer">
      <div class="footer-line"></div>
      Powered by Cequre Engine
      <div class="footer-line"></div>
    </div>
  </div>
</body>
</html>
